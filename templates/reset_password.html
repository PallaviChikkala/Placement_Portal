<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Placement Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* Same base styles as forgot_password.html / verify_otp.html */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; font-family: 'DM Sans', sans-serif; background: linear-gradient(145deg, #fffdf5 0%, #fff8e1 40%, #fef3c0 75%, #fffdf5 100%); position: relative; overflow-x: hidden; }
.blob { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(55px); z-index: 0; }
.blob-1 { width: 280px; height: 280px; background: rgba(230,180,40,0.22); top: -70px; left: -50px; }
.blob-2 { width: 220px; height: 220px; background: rgba(255,220,80,0.18); bottom: -50px; right: -30px; }
.blob-3 { width: 160px; height: 160px; background: rgba(255,200,50,0.15); top: 40%; left: 55%; }
.global-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(253,230,138,0.6); padding: 10px 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,0.02); }
.logo-area { display: flex; align-items: center; gap: 14px; }
.logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: 800; font-family: 'Syne', sans-serif; }
.logo-text h2 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; color: #78350f; line-height: 1.2; }
.logo-text p { font-size: 9px; letter-spacing: 0.5px; color: #b97f10; text-transform: uppercase; }
.main-wrapper { width: 100%; max-width: 440px; position: relative; z-index: 2; margin-top: 60px; }
.login-panel { background: rgba(255,255,255,0.82); border-radius: 16px; padding: 36px 30px; backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(120,53,15,0.08); border: 1px solid rgba(253,230,138,0.5); text-align: center; }
.portal-tag { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 11px; font-weight: 700; color: #10b981; text-transform: uppercase; letter-spacing: 1px; justify-content: center; }
.panel-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: #78350f; margin-bottom: 8px; }
.panel-sub { font-size: 13px; color: #b97f10; margin-bottom: 28px; font-weight: 500; line-height: 1.5; }
.form-group { text-align: left; margin-bottom: 20px; position: relative; }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: #78350f; margin-bottom: 8px; }
.input-wrapper { position: relative; display: flex; align-items: center; }
.input-wrapper i { position: absolute; left: 14px; color: #b97f10; font-size: 18px; pointer-events: none; }
.form-control { width: 100%; padding: 12px 14px 12px 42px; border-radius: 9px; border: 1px solid rgba(253,230,138,0.8); background: #fffdf9; font-family: 'DM Sans', sans-serif; font-size: 14px; color: #451a03; outline: none; transition: all 0.2s; }
.form-control:focus { border-color: #d97706; box-shadow: 0 0 0 3px rgba(253,230,138,0.3); }
.signin-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #d97706, #b45309); color: white; border: none; border-radius: 9px; cursor: pointer; font-weight: 700; font-family: 'DM Sans', sans-serif; font-size: 15px; transition: opacity 0.2s; box-shadow: 0 8px 20px rgba(217,119,6,0.3); }
.signin-btn:hover { opacity: 0.9; }
.divider { border: none; border-top: 1px solid rgba(253,230,138,0.5); margin: 24px 0 20px; }
.footer-row { display: flex; justify-content: center; font-size: 12px; font-weight: 600; }
.footer-row a { color: #d97706; text-decoration: none; display: flex; align-items: center; gap: 6px; }
.footer-row a:hover { text-decoration: underline; }
#toastContainer { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 2000; }
.toast { background: white; border-radius: 8px; padding: 14px 20px; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 12px; animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; border-left: 4px solid #10b981; }
.toast.error { border-left-color: #ef4444; }
.toast.info { border-left-color: #3b82f6; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="global-header">
  <div class="logo-area">
    <img src="/static/nitap_logo.png" class="logo-img" alt="NIT AP Logo" style="height: 40px; width: auto;">
    <div class="logo-text">
      <h2>National Institute of Technology<br>Andhra Pradesh</h2>
      <p>Training &amp; Placement Cell</p>
    </div>
  </div>
</div>

<div class="main-wrapper">
  <div class="login-panel">
    <div class="portal-tag"><i class="ti ti-lock" style="font-size: 16px;"></i> Secure Password Reset</div>
    <div class="panel-title">Set New Password</div>
    <div class="panel-sub">Enter a new strong password below to regain access to your account.</div>

    <form action="/reset_password" method="POST">
      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrapper">
          <i class="ti ti-lock"></i>
          <input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrapper">
          <i class="ti ti-lock-check"></i>
          <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
        </div>
      </div>
      
      <button type="submit" class="signin-btn">Reset Password <i class="ti ti-arrow-right" style="margin-left:4px;"></i></button>
    </form>

    <hr class="divider">
    <div class="footer-row">
      <a href="/forgot_password"><i class="ti ti-arrow-left"></i> Cancel</a>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  let icon = 'ti-info-circle';
  if (type === 'error') icon = 'ti-alert-circle';
  else if (type === 'success') icon = 'ti-check';
  
  toast.innerHTML = `<i class="ti ${icon}" style="font-size:18px; color: ${type==='error'?'#ef4444':type==='success'?'#10b981':'#3b82f6'};"></i> <span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'fadeOut 0.3s ease forwards';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

// Flash messages
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      showToast("{{ message }}", "{{ category }}");
    {% endfor %}
  {% endif %}
{% endwith %}
</script>
</body>
</html>
