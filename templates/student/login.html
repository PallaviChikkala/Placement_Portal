<html>
    <head>
        <title>Student Login Authentication</title>
        <link href = "	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <style>
            body
            {
                background-color :antiquewhite;
                margin : 0;
            }
            .card
            {
                background-color: white;
            }
            .card {
                background-color: white;
                transition: 0.3s;
            }

            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            }

            .btn-warning {
                background-color: #f9d464;
                transition: 0.3s;
            }

            .btn-warning:hover {
                transform: scale(1.03);
                background-color: #f6c83f;
            }

            .form-control:focus {
                border-color: #ffc107;
                box-shadow: 0 0 8px rgba(255, 193, 7, 0.5);
            }
        </style>
    </head>
   <body>
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow rounded-4 p-4" style="width: 900px; height: 500px;">
            <div class="row align-items-center h-100">

                <div class="col-md-6 text-center">
                    <h5 class="card-title">Student Login</h5>
                    <p class="card-text">Make sure your account is secure.</p>

                    <img src="../../static/ChatGPT Image Jun 4, 2026, 10_48_06 AM.png"
                         class="img-fluid"
                         style="width: 350px;"
                         alt="Login Image">
                </div>

                <div class="col-md-6">
                    <img src="../../static/StudentLogin.png" class="rounded mx-auto d-block mb-3" style="width: 100px;" alt="NIT AP Logo">
                    <h4 class="mb-3 text-center">Login</h4>

                    <form>
                    <input type="text" class="form-control mb-3" placeholder="Enter Student ID">
                    <input type="password" class="form-control mb-3" placeholder="Enter Password">

                    <div class="text-end mb-3">
                        <a href="#" class="text-decoration-none">Forgot Password?</a>
                    </div>

                    <button type = "submit" class="btn btn-warning w-100">LOGIN</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
