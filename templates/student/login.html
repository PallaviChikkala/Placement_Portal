<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Placement Portal</title>
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style System -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #faf8f5 0%, #fef8e6 50%, #f5eada 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 950px;
            min-height: 550px;
            overflow: hidden;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(217, 119, 6, 0.15);
            box-shadow: 0 24px 60px rgba(120, 53, 15, 0.08);
            background-color: white;
        }
        .login-info-panel {
            background: linear-gradient(135deg, #fdfbf7 0%, #fef8e6 100%);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }
        .login-info-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }
        .login-form-panel {
            background-color: #ffffff;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
            margin-bottom: 20px;
        }
        .glow-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
            border: none;
            color: white;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 14px;
            border-radius: var(--radius-full);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
        }
        .glow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4);
            color: white;
        }
        .glow-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card login-container border-0 animated-fade-in-up">
        <div class="row g-0 h-100">
            <!-- Left Info Panel -->
            <div class="col-lg-6 login-info-panel text-center d-none d-lg-flex">
                <div class="mb-4">
                    <h3 class="text-primary fw-bold mb-2" style="font-family: var(--font-heading);">Placement Portal</h3>
                    <p class="text-muted px-4">Your single platform to prepare, apply, and secure your dream career.</p>
                </div>
                <img src="/static/ChatGPT Image Jun 4, 2026, 10_48_06 AM.png"
                     class="img-fluid animated-fade-in delay-200"
                     style="max-width: 80%; max-height: 280px; object-fit: contain; filter: drop-shadow(0 15px 25px rgba(120, 53, 15, 0.08));"
                     alt="Portal Illustration">
                <div class="mt-4 text-muted small">
                    <i class="bi bi-shield-lock-fill text-warning me-2"></i> Secured Student Authentication Portal
                </div>
            </div>

            <!-- Right Form Panel -->
            <div class="col-lg-6 col-md-12 login-form-panel">
                <div class="text-center text-lg-start mb-4">
                    <img src="/static/StudentLogin.png" class="logo-img" alt="NIT AP Logo">
                    <h2 class="text-primary fw-extrabold mb-1" style="font-family: var(--font-heading); font-size: 2rem;">Welcome Back</h2>
                    <p class="text-muted">Log in to check your eligibility and manage applications.</p>
                </div>

                <form action="/student_login_check" method="POST" class="mt-2">
                    <!-- Email Input -->
                    <div class="floating-group">
                        <input type="email" name="email" class="form-premium floating-input" placeholder=" " required id="email">
                        <label for="email" class="floating-label">Student Email Address</label>
                    </div>

                    <!-- Password Input -->
                    <div class="floating-group position-relative">
                        <input type="password" name="password" id="password" class="form-premium floating-input" placeholder=" " required>
                        <label for="password" class="floating-label">Password</label>
                        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent text-muted" onclick="togglePasswordVisibility()" style="padding-right: 16px;">
                            <i id="eyeIcon" class="bi bi-eye-slash fs-5"></i>
                        </button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 text-muted">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe" style="border-color: var(--border-color);">
                            <label class="form-check-label small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="/forgot_password" class="text-warning text-decoration-none small hover-underline">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn w-100 glow-btn py-3">LOGIN</button>
                </form>

                <div class="mt-4 text-center text-muted small">
                    Need help? Contact college placement cell at <a href="mailto:placements@nitap.ac.in" class="text-warning text-decoration-none">placements@nitap.ac.in</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePasswordVisibility() {
            const passwordField = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                eyeIcon.classList.remove("bi-eye-slash");
                eyeIcon.classList.add("bi-eye");
            } else {
                passwordField.type = "password";
                eyeIcon.classList.remove("bi-eye");
                eyeIcon.classList.add("bi-eye-slash");
            }
        }
    </script>
</body>
</html>
