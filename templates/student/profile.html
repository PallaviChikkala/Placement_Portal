<html>
    <head>
        <title>Student Profile</title>
        <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <style>
            body {
    background: linear-gradient(135deg, #fff3cd, #f3e1e2);
}
    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
   .profile-card {
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.5);

}

.card {
    transition: 0.3s ease;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
}


.badge {
    transition: 0.3s ease;
}

.badge:hover {
    transform: scale(1.08);
}

.btn {
    transition: 0.3s ease;
}

.btn:hover {
    transform: scale(1.05);
}
.info-card {
    border-radius: 20px;
    background: white;
    transition: 0.3s;
}

.info-card:hover {
    transform: translateY(-10px);
    background: #fff8dc;
}
@keyframes fadeInUp {
    
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.profile-card {
    background: linear-gradient(
        135deg,
        rgba(255,255,255,0.95),
        rgba(255,248,220,0.95)
    );
    border-radius: 30px;
    border: none;
    overflow: hidden;
    position: relative;
    animation: fadeInUp 0.8s ease;
}

.student-name {
    font-weight: bold;
    letter-spacing: 1px;
}
.branch-badge {
    animation: pulse 2s infinite;
}
.profile-header {
    background: linear-gradient(135deg,#f9d464,#ffe680);
    padding: 30px;
    border-radius: 20px;
    margin-bottom: 20px;
}
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
}
.skill-badge {
    display: inline-block;
    color: rgb(10, 4, 4);
    padding: 10px 18px;
    border-radius: 25px;
    margin: 5px;
    font-weight: 600;
}

.skill-badge:hover {
    transform: scale(1.1);
}
.skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-top: 15px;
}

.skill-item {
    border: 1px solid #ddd;
    padding: 10px;
    border-radius: 15px;
    text-align: center;
    font-weight: 600;
    background-color: white;
    transition: 0.3s;
}

.skill-item:hover {
    transform: translateY(-5px);
    background-color: #fff8dc;
}
</style>
    </head>
    <body>
        
       <div class="container ">
<div class="card profile-card shadow-lg rounded-4 mx-auto p-4" style="max-width: 750px;">
        <div class="profile-header text-center mb-4">
            <div class="position-absolute top-0 end-0 m-3">
    <i class="bi bi-patch-check-fill text-warning fs-2"></i>
</div>
            <img src="../../static/StudentLogin.png"
                 class="rounded-circle shadow mb-3"
                 style="width: 120px; height: 120px; object-fit: cover;">

            <h2 class="student-name">{{ student.name }}</h2>
            <p class="text-muted">{{ student.email }}</p>

           <span class="badge bg-warning text-dark px-3 py-2 branch-badge">
    {{ student.branch }}
</span>
        </div>

        <hr>

        <div class="row text-center">
            <div class="col-md-4">
<div class="card info-card p-3 shadow-sm">
<h6><i class="bi bi-person-badge"></i> Student ID</h6>
                    <h5>{{ student.student_id }}</h5>
                </div>
            </div>

            <div class="col-md-4">
<div class="card info-card p-3 shadow-sm">
<h6><i class="bi bi-calendar-event"></i> Batch</h6>
                    <h5>{{ student.batch }}</h5>
                </div>
            </div>

            <div class="col-md-4">
<div class="card info-card p-3 shadow-sm">
<h6><i class="bi bi-award"></i> CGPA</h6>
                    <h5>{{ student.cgpa }}</h5>
                </div>
            </div>
        </div>

    
<div class="mt-4">
    <h5><i class="bi bi-lightning-charge-fill"></i> Skills</h5>

    <div class="skills-grid">
        <div class="skill-item">{{ student.skills }}</div>
    </div>
</div>
        <div class="text-center mt-4">
            <a href="/student_dashboard" class="btn btn-outline-dark rounded-pill px-4">
                Back to Dashboard
            </a>
        </div>

    </div>
</div>
    </body>
</html>
