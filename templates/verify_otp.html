<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Code — Placement Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* Same base styles as forgot_password.html */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; font-family: 'DM Sans', sans-serif; background: linear-gradient(145deg, #fffdf5 0%, #fff8e1 40%, #fef3c0 75%, #fffdf5 100%); position: relative; overflow-x: hidden; }
.blob { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(55px); z-index: 0; }
.blob-1 { width: 280px; height: 280px; background: rgba(230,180,40,0.22); top: -70px; left: -50px; }
.blob-2 { width: 220px; height: 220px; background: rgba(255,220,80,0.18); bottom: -50px; right: -30px; }
.blob-3 { width: 160px; height: 160px; background: rgba(255,200,50,0.15); top: 40%; left: 55%; }
.global-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(253,230,138,0.6); padding: 10px 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,0.02); }
.logo-area { display: flex; align-items: center; gap: 14px; }
.logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: 800; font-family: 'Syne', sans-serif; }
.logo-text h2 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; color: #78350f; line-height: 1.2; }
.logo-text p { font-size: 9px; letter-spacing: 0.5px; color: #b97f10; text-transform: uppercase; }
.main-wrapper { width: 100%; max-width: 440px; position: relative; z-index: 2; margin-top: 60px; }
.login-panel { background: rgba(255,255,255,0.82); border-radius: 16px; padding: 36px 30px; backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(120,53,15,0.08); border: 1px solid rgba(253,230,138,0.5); text-align: center; }
.portal-tag { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 11px; font-weight: 700; color: #10b981; text-transform: uppercase; letter-spacing: 1px; justify-content: center; }
.panel-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: #78350f; margin-bottom: 8px; }
.panel-sub { font-size: 13px; color: #b97f10; margin-bottom: 28px; font-weight: 500; line-height: 1.5; }
.otp-input-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
.otp-digit { width: 45px; height: 55px; border-radius: 10px; border: 2px solid rgba(253,230,138,0.8); background: #fffdf9; font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: #78350f; text-align: center; outline: none; transition: all 0.2s; }
.otp-digit:focus { border-color: #d97706; box-shadow: 0 0 0 3px rgba(253,230,138,0.3); }
.signin-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 9px; cursor: pointer; font-weight: 700; font-family: 'DM Sans', sans-serif; font-size: 15px; transition: opacity 0.2s; box-shadow: 0 8px 20px rgba(16,185,129,0.3); }
.signin-btn:hover { opacity: 0.9; }
.divider { border: none; border-top: 1px solid rgba(253,230,138,0.5); margin: 24px 0 20px; }
.footer-row { display: flex; justify-content: center; font-size: 12px; font-weight: 600; }
.footer-row a { color: #d97706; text-decoration: none; display: flex; align-items: center; gap: 6px; }
.footer-row a:hover { text-decoration: underline; }
#toastContainer { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 2000; }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="global-header">
  <div class="logo-area">
    
    <div class="logo-text">
      <h2>University Name</h2>
      <p>Training &amp; Placement Cell</p>
    </div>
  </div>
</div>

<div class="main-wrapper">
  <div class="login-panel">
    <div class="portal-tag"><i class="ti ti-mail-check" style="font-size: 16px;"></i> Verification Code Sent</div>
    <div class="panel-title">Enter Verification Code</div>
    <div class="panel-sub">We've sent a 6-digit authentication code to <strong>{{ email }}</strong>. Please enter it below.</div>

    <form action="/verify_otp" method="POST" id="otpForm">
      {% if role == 'student' %}
      <div style="margin-bottom: 20px; text-align: left;">
          <label style="font-size: 13px; font-weight: 700; color: #78350f; margin-bottom: 6px; display: block;">Aadhar Last 5 Digits</label>
          <input type="text" name="aadhar_last5" required style="width: 100%; padding: 12px; border: 1px solid rgba(253,230,138,0.8); border-radius: 8px; font-family: 'DM Sans', sans-serif; outline: none; transition: all 0.2s; background: #fffdf9; color: #78350f;" maxlength="5">
      </div>
      <div style="margin-bottom: 24px; text-align: left;">
          <label style="font-size: 13px; font-weight: 700; color: #78350f; margin-bottom: 6px; display: block;">Full PAN Card Number</label>
          <input type="text" name="pan_number" required style="width: 100%; padding: 12px; border: 1px solid rgba(253,230,138,0.8); border-radius: 8px; font-family: 'DM Sans', sans-serif; outline: none; transition: all 0.2s; background: #fffdf9; color: #78350f; text-transform: uppercase;" maxlength="10">
      </div>
      {% endif %}
      <input type="hidden" name="otp" id="fullOtp">
      <div class="otp-input-container">
        <input type="text" class="otp-digit" maxlength="1" autofocus>
        <input type="text" class="otp-digit" maxlength="1">
        <input type="text" class="otp-digit" maxlength="1">
        <input type="text" class="otp-digit" maxlength="1">
        <input type="text" class="otp-digit" maxlength="1">
        <input type="text" class="otp-digit" maxlength="1">
      </div>
      
      <button type="submit" class="signin-btn">Verify Code <i class="ti ti-check" style="margin-left:4px;"></i></button>
    </form>

    <hr class="divider">
    <div class="footer-row">
      <a href="/forgot_password">Try another email address</a>
    </div>
  </div>
</div>

<div id="toastContainer"></div>
<script>
// OTP Auto-advance logic
const inputs = document.querySelectorAll('.otp-digit');
inputs.forEach((input, index) => {
  input.addEventListener('input', (e) => {
    if (e.target.value.length === 1 && index < inputs.length - 1) {
      inputs[index + 1].focus();
    }
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
      inputs[index - 1].focus();
    }
  });
});

document.getElementById('otpForm').addEventListener('submit', (e) => {
  let otpVal = '';
  inputs.forEach(i => otpVal += i.value);
  document.getElementById('fullOtp').value = otpVal;
});

function showToast(msg, type="success") {
  let c = document.getElementById("toastContainer");
  const t = document.createElement("div");
  const bg = { success: "linear-gradient(135deg,#10b981,#059669)", error: "linear-gradient(135deg,#ef4444,#dc2626)", info: "linear-gradient(135deg,#3b82f6,#2563eb)" };
  t.style.cssText = `background:${bg[type]||bg.success};color:white;padding:14px 24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.15);display:flex;align-items:center;gap:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;opacity:0;transform:translateY(20px);transition:all 0.3s;`;
  t.innerHTML = `<i class="ti ${type==='error'?'ti-alert-circle':(type==='info'?'ti-mail':'ti-info-circle')}" style="font-size:18px;"></i><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity="1"; t.style.transform="translateY(0)"; }, 10);
  setTimeout(() => { t.style.opacity="0"; t.style.transform="translateY(-20px)"; setTimeout(() => t.remove(), 300); }, 5000);
}

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      showToast("{{ message }}", "{{ category if category != 'message' else 'success' }}");
    {% endfor %}
  {% endif %}
{% endwith %}
</script>
<script>document.addEventListener("DOMContentLoaded", function() { document.querySelectorAll(".modal").forEach(function(m) { document.body.appendChild(m); }); });</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('img').forEach(img => {
        img.onerror = function() {
            this.onerror = null; // Prevent infinite loop if default image is also missing
            this.style.display = 'none';
        };
    });
});
</script>
</body>

</html>
